[build-system]
requires = [
    "setuptools>=63.0",
    "trove-classifiers",
    "wheel",
]

build-backend = "setuptools.build_meta"

[project]
name = "rollergpx"
version = "0.6.2"
description = "Add distance details to a GPX file generated from a roller ride"
authors = [
    { name = "Skip Montanaro", email = "skip.montanaro@gmail.com" },
]
requires-python = ">=3.11"

dependencies = [
    "haversine",
    "python-dateutil>=2.8.2",
]

[tool.setuptools]
    include-package-data = true

[tool.setuptools.packages.find]
    where = ["."]
    include = ["rollergpx"]
    namespaces = false

[tool.setuptools.package-data]
    "rollergpx" = ["rollergpx/data/*.csv"]

[project.scripts]
    rollergpx = "rollergpx.rollergpx:main"
    gpxtolatlong = "rollergpx.gpxtolatlong:main"
