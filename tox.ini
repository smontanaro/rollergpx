[tox]
env_list =
    lint,py{311,312,313,314}
minversion = 4.24.1

[testenv]
description = run the tests with pytest
package = wheel
wheel_build_env = .pkg
deps =
    pytest>=6
    pytest-cov
commands =
    python -c 'import os, sys ; print("**", os.path.realpath(sys.executable), "**")'
    pytest --cov=rollergpx --cov-report=html {tty:--color=yes} {posargs}
    coverage report

[testenv:lint]
description = run linters
deps =
    ruff
    pylint
    pytest>=6
commands =
    -pylint rollergpx tests
    -ruff check rollergpx tests
